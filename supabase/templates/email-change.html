<!-- Rakt Response: confirm email change (token-hash link). -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #202124;">
  <h2 style="color: #152b50;">Confirm your new email</h2>
  <p>Please confirm that you want to use this address for your Rakt Response account.</p>
  <p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change" style="display: inline-block; background: #c82032; color: #ffffff; padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: bold;">Confirm new email</a>
  </p>
</div>
